# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
radarr:
  movies:
    base_url: http://radarr:7878
    api_key: !secret radarr_apikey
    delete_old_custom_formats: true
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
    custom_formats:
      # OnePlus Y1S Pro has no Dolby Vision support, and the server cannot
      # tone-map. DV *with* an HDR10 fallback direct-plays fine, so only
      # reject the variants that don't.
      - trash_ids:
          - 923b6abef9b17f937fab56cfcf89e1f1 # DV (w/o HDR fallback)
          - f700d29429c023a5734505e77daeaea7 # DV (Disk)
        assign_scores_to:
          - name: UHD Bluray + WEB
            score: -10000
          - name: HD Bluray + WEB
            score: -10000
sonarr:
  tv:
    base_url: http://sonarr:8989
    api_key: !secret sonarr_apikey
    delete_old_custom_formats: true
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p
        reset_unmatched_scores:
          enabled: true
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        reset_unmatched_scores:
          enabled: true
    custom_format_groups:
      add:
        - trash_id: d776a1ea912a117d66d83b880ff2055d # [HDR Formats] DV (w/o HDR fallback)
