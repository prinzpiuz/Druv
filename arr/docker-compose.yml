name: arr Services
# json-file without options never rotates; a crash loop could fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  gluetun:
    image: qmcgaw/gluetun:${GLUETUN_VERSION:?set in version.env}
    container_name: gluetun
    logging: *default-logging
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Moved from qbittorrent, which shares this network namespace: set there,
    # they changed gluetun's namespace too.
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - /configs/gluetun:/gluetun
    # The image allows only ~25s (10s grace, 5s interval, 3 retries) to bring up
    # the tunnel, resolve DNS through it and dial cloudflare.com:443. A slow
    # handshake marked gluetun unhealthy and aborted every dependent service.
    # Only the timings are overridden; the image's own test command is kept.
    healthcheck:
      start_period: 120s
      interval: 10s
      timeout: 10s
      retries: 6
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_CITIES=${SERVER_CITIES}
      - UPDATER_PERIOD=24h
    restart: always
    ports:
      - 54509:54509
      - 54509:54509/udp
      - 51820:51820
      - 51820:51820/udp
      - 8080:8080 # qbittorrent
      - 9696:9696 # Prowlarr
      - 9117:9117 # Jackett
      - 5216:5216 # myspeed
      - 8000:8000 # gluetun
      - 5055:5055 # jellyseer
      - 5030:5030 # slskd
    env_file:
      - .env
    networks:
      default:
        ipv4_address: ${GLUETUN_IPV4_ADDR}
  #TODO implement search plugins
  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:${QBITTORRENT_VERSION:?set in version.env}
    container_name: qbittorrent
    logging: *default-logging
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=${TZ}
      - WEBUI_PORTS=8080/tcp,8080/udp
      - PRIVOXY_ENABLED=false
      - UNBOUND_ENABLED=false
    volumes:
      - /configs/qbit:/config
      - /data:/data
    network_mode: service:gluetun
    env_file:
      - .env
    depends_on:
      gluetun:
        condition: service_healthy
  radarr:
    image: ghcr.io/hotio/radarr:${RADARR_VERSION:?set in version.env}
    container_name: radarr
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 7878:7878
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /configs/radarr:/config
      - /data:/data
    depends_on:
      - gluetun
    env_file:
      - .env
    networks:
      default:
        ipv4_address: ${RADARR_IPV4_ADDR}
  sonarr:
    image: ghcr.io/hotio/sonarr:${SONARR_VERSION:?set in version.env}
    container_name: sonarr
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 8989:8989
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /configs/sonarr:/config
      - /data:/data
    depends_on:
      - gluetun
    env_file:
      - .env
    networks:
      default:
        ipv4_address: ${SONARR_IPV4_ADDR}
  navidrome:
    image: deluan/navidrome:${NAVIDROME_VERSION:?set in version.env}
    container_name: navidrome
    logging: *default-logging
    restart: unless-stopped
    user: 1000:1000
    ports:
      - 4533:4533
    environment:
      - TZ=${TZ}
      - ND_MUSICFOLDER=/music
      - ND_LASTFM_APIKEY=${ND_LASTFM_APIKEY}
      - ND_LASTFM_SECRET=${ND_LASTFM_SECRET}
    volumes:
      - /configs/navidrome:/data
      # Read-only: only Soulbeet writes to the library.
      - /data/media/music:/music:ro
    networks:
      - ${NETWORK_NAME}
  # Soulseek traffic goes through the VPN. Its web UI port is published on gluetun.
  slskd:
    image: slskd/slskd:${SLSKD_VERSION:?set in version.env}
    container_name: slskd
    logging: *default-logging
    restart: unless-stopped
    user: 1000:1000
    environment:
      - TZ=${TZ}
      # Soulbeet changes slskd settings through the API.
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_USERNAME=${SLSKD_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_PASSWORD}
      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
    volumes:
      - /configs/slskd:/app
      - /data/slskd/downloads:/app/downloads
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
  soulbeet:
    image: docker.io/docccccc/soulbeet:${SOULBEET_VERSION:?set in version.env}
    container_name: soulbeet
    logging: *default-logging
    restart: unless-stopped
    user: 1000:1000
    ports:
      - 9765:9765
    environment:
      - TZ=${TZ}
      - DATABASE_URL=sqlite:/data/soulbeet.db
      - DOWNLOAD_PATH=/downloads
      - SECRET_KEY=${SOULBEET_SECRET_KEY}
      - NAVIDROME_URL=http://navidrome:4533
    volumes:
      - /configs/soulbeet:/data
      # Both paths must match the slskd and Navidrome mounts above.
      - /data/slskd/downloads:/downloads
      - /data/media/music:/music
    networks:
      - ${NETWORK_NAME}
    depends_on:
      - slskd
      - navidrome
  swurApp:
    image: owlcaribou/swurapp@${SWURAPP_DIGEST:?set in version.env}
    container_name: sonarrWatchUntilRelease
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - API_KEY=${SONARR_API_KEY}
      - BASE_URL=http://${SONARR_IPV4_ADDR}:8989
      - DELAY_IN_MINUTES=60
      - IGNORE_TAG_NAME=ignore
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:${FLARESOLVERR_VERSION:?set in version.env}
    container_name: flaresolverr
    logging: *default-logging
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - TZ=${TZ}
    ports:
      - 8191:8191
    volumes:
      - /configs/flaresolverr:/config
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    env_file:
      - .env
    networks:
      default:
        ipv4_address: ${FLARESOLVERR_IPV4_ADDR}
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_VERSION:?set in version.env}
    container_name: prowlarr
    logging: *default-logging
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - /configs/prowlarr:/config
    restart: always
    network_mode: service:gluetun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    env_file:
      - .env
    depends_on:
      gluetun:
        condition: service_healthy
  jackett:
    image: lscr.io/linuxserver/jackett:${JACKETT_VERSION:?set in version.env}
    container_name: jackett
    logging: *default-logging
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - AUTO_UPDATE=true
    network_mode: service:gluetun
    volumes:
      - /configs/jackett:/config
      - /data:/downloads
    restart: always
    env_file:
      - .env
    depends_on:
      gluetun:
        condition: service_healthy
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:${RECYCLARR_VERSION:?set in version.env}
    container_name: recyclarr
    logging: *default-logging
    user: 1000:1000
    volumes:
      - /configs/recyclarr:/config
    restart: always
    environment:
      - CRON_SCHEDULE=@daily
      - TZ=${TZ}
    env_file:
      - .env
    networks:
      - ${NETWORK_NAME}
  bazarr:
    image: ghcr.io/hotio/bazarr:${BAZARR_VERSION:?set in version.env}
    container_name: bazarr
    restart: always
    logging: *default-logging
    ports:
      - 6767:6767
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /configs/bazarr:/config
      - /data/media:/data/media
    depends_on:
      gluetun:
        condition: service_healthy
    env_file:
      - .env
    networks:
      default:
        ipv4_address: ${BAZARR_IPV4_ADDR}
  unpackerr:
    image: golift/unpackerr:${UNPACKERR_VERSION:?set in version.env}
    container_name: unpackerr
    logging: *default-logging
    volumes:
      - /data:/downloads
    restart: always
    user: 1000:1000
    environment:
      - TZ=${TZ}
      - UN_LOG_FILE=/downloads/unpackerr.log
      - UN_SONARR_0_URL=http://${SONARR_IPV4_ADDR}:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_RADARR_0_URL=http://${RADARR_IPV4_ADDR}:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    networks:
      - ${NETWORK_NAME}
networks:
  default:
    name: ${NETWORK_NAME}
    external: true
