name: Backup Services
# json-file without options never rotates; a crash loop could fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  backrest:
    image: garethgeorge/backrest:${BACKREST_VERSION:?set in version.env}
    container_name: backrest
    logging: *default-logging
    hostname: backrest
    network_mode: host
    volumes:
      - /configs/backrest/data:/data
      - /configs/backrest/config:/config
      - /configs/backrest/cache:/cache
      - /configs:/homelab_volumes:ro
      - ${BACKREST_REPO}:/repos
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
      - TZ=${TZ}
    restart: unless-stopped
