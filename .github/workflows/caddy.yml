name: Caddy
on:
  push:
    paths:
      - "public/Caddyfile.template"
      - "public/version.env"
      - ".github/workflows/caddy.yml"
  pull_request:
    paths:
      - "public/Caddyfile.template"
      - "public/version.env"
jobs:
  validate:
    name: Validate Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Validates with the same image tag the VPS runs, so a Caddy bump in
      # public/version.env is checked against the template before it deploys.
      - name: Read pinned Caddy version
        id: version
        run: |
          tag=$(sed -n 's/^CADDY_CLOUDFLARE_VERSION=//p' public/version.env)
          if [ -z "$tag" ]; then
            echo "CADDY_CLOUDFLARE_VERSION not found in public/version.env" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Render and validate
        env:
          CADDY_TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker run --rm \
            -v "$PWD/public:/src:ro" \
            -e REVERSE_PROXY_URL="127.0.0.1" \
            -e CLOUDFLARE_API_TOKEN="abcdefghijklmnopqrstuvwxyz0123456789abcd" \
            --entrypoint /bin/sh \
            "caddybuilds/caddy-cloudflare:$CADDY_TAG" \
            -c 'apk add --no-cache gettext > /dev/null &&
                envsubst < /src/Caddyfile.template > /tmp/Caddyfile &&
                caddy validate --adapter caddyfile --config /tmp/Caddyfile'
