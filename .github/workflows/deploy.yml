name: Deploy
on:
  push:
    branches:
      - main
    paths:
      - "public/**"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up SSH
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      # Pins the VPS host key so ssh refuses any other machine at VPS_HOST.
      - name: Trust VPS host key
        env:
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "VPS_KNOWN_HOSTS secret is empty; add the VPS host key line (ssh-keyscan output)." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
      - name: Copy files to Server
        run: |
          rsync -avz --delete \
          --filter='P /.env' \
          --filter='P /caddy_data/' \
          --filter='P /caddy_config/' \
          --filter='P /configs/' \
          --filter='P /configs/' \
          ./public/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/Druv/
      - name: Deploy on Server
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          cd ~/Druv/
          export COMPOSE_ENV_FILES=.env,version.env
          docker compose pull
          docker compose up -d --remove-orphans
          EOF
      - name: Deployment Complete
        if: success()
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Public Services Deployed Successfully!
      - name: Deployment Failed
        if: failure()
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Alert! Deployment Failed for Druv Setup Scripts.
            Please check the GitHub Actions logs for more details.
      - name: Clean up old deployments
        if: success()
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          docker system prune -f
          EOF
