repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # The couchdb container chowns its local.d mount to uid 5984, so these
      # hooks cannot open 10-livesync.ini for writing.
      - id: trailing-whitespace
        exclude: ^10-livesync\.ini$
      - id: end-of-file-fixer
        exclude: ^10-livesync\.ini$
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
  - repo: https://github.com/google/yamlfmt
    rev: v0.20.0
    hooks:
      - id: yamlfmt
  - repo: local
    hooks:
      # Renders all three compose projects. Needs Docker. Missing .env files
      # are created from .env.sample, so CI works without secrets.
      - id: validate-compose
        name: docker compose config (all stacks)
        entry: ./scripts/validate-compose.sh
        language: script
        pass_filenames: false
        always_run: true
