# json-file without options never rotates; a crash loop could fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?set in version.env}
    container_name: n8n
    logging: *default-logging
    restart: unless-stopped
    ports:
      - 5678:5678
    env_file:
      - .env
    environment:
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - EXECUTIONS_MODE=regular
    volumes:
      - /data/n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows:ro
    networks:
      - ${NETWORK_NAME}
networks:
  default:
    name: ${NETWORK_NAME}
    external: true
