name: Tools
# json-file without options never rotates; a crash loop could fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
include:
  - path: ./dawarich/docker-compose.yml
  - path: ./blotils/docker-compose.yml
  - path: ./priceStalker/docker-compose.yml
services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:?set in version.env}
    container_name: qdrant
    logging: *default-logging
    restart: unless-stopped
    ports:
      - 6333:6333
    volumes:
      - /data/qdrant_storage:/qdrant/storage:z
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple:${BENTOPDF_VERSION:?set in version.env}
    container_name: bentopdf
    logging: *default-logging
    restart: unless-stopped
    ports:
      - 8085:8080
  SnapOtter:
    image: snapotter/snapotter:${SNAPOTTER_VERSION:?set in version.env}
    container_name: snapotter
    restart: unless-stopped
    ports:
      - 1349:1349
    volumes:
      - /data/snapotter:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1349/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    shm_size: "2gb" # Needed for Python ML shared memory
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - AUTH_ENABLED=true
      - DEFAULT_USERNAME=${SNAPOTTER_USERNAME}
      - DEFAULT_PASSWORD=${SNAPOTTER_PASSWORD}
