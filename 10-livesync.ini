; CouchDB configuration for Obsidian Self-hosted LiveSync
; Mounted at /opt/couchdb/etc/local.d/10-livesync.ini

[couchdb]
single_node = true
; 50 MB. Your largest attachment is well under this; raise only if a
; single image exceeds it.
max_document_size = 50000000

[chttpd]
; THE important line for a publicly exposed instance. Without it, CouchDB
; serves unauthenticated reads on many endpoints.
require_valid_user = true
max_http_request_size = 4294967296
enable_cors = true
bind_address = 0.0.0.0

[chttpd_auth]
require_valid_user = true
; Brute-force cost. Higher = slower hashing = slower password guessing.
iterations = 10000

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
; app://obsidian.md      -> Obsidian desktop
; capacitor://localhost  -> Obsidian Android/iOS
; http://localhost       -> Obsidian mobile fallback
; Do NOT add "*" here. It would let any website in a browser talk to your DB.
origins = app://obsidian.md,capacitor://localhost,http://localhost,https://livesync.prinzpiuz.in

credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600

[log]
level = warning
