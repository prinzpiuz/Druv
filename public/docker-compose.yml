# json-file without options never rotates; a crash loop could fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  caddy:
    image: caddybuilds/caddy-cloudflare:${CADDY_CLOUDFLARE_VERSION:?set in version.env}
    container_name: caddy_homelab
    logging: *default-logging
    network_mode: host
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - REVERSE_PROXY_URL=${REVERSE_PROXY_URL}
    env_file:
      - .env
    # start_caddy.sh renders the template to /etc/caddy/Caddyfile inside the
    # container. Not bind-mounted: the committed copy went stale and was
    # overwritten at every start anyway.
    volumes:
      - ./Caddyfile.template:/etc/caddy/Caddyfile.template
      - ./caddy_data:/data
      - ./caddy_config:/config
      - ./start_caddy.sh:/start_caddy.sh
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/start_caddy.sh"]
  beszel-agent:
    image: henrygd/beszel-agent:${BESZEL_AGENT_VERSION:?set in version.env}
    container_name: beszel-agent-apps.prinzpiuz.in
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./configs/beszel_agent_data:/var/lib/beszel-agent
      - ./configs/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
      - CAP_PERFMON
    devices:
      - /dev/sda:/dev/sda
    environment:
      - LISTEN=/beszel_socket/beszel.sock
      - HUB_URL=http://${HOMELAB_TAILNET_IP}:8090
      - TOKEN=${BESZEL_TOKEN}
      - KEY=${BESZEL_KEY}
