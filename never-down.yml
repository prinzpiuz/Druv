services:
  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_VERSION:?set in version.env}
    container_name: uptime-kuma
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /configs/uptime-kuma/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 3001:3001
  beszel:
    image: henrygd/beszel:${BESZEL_VERSION:?set in version.env}
    container_name: beszel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - USER_EMAIL=${BESZEL_USERNAME}
      - USER_PASSWORD=${BESZEL_PASSWORD}
      - AUTO_LOGIN=${BESZEL_USERNAME}
    ports:
      - 8090:8090
    volumes:
      - /configs/beszel_server_data/beszel_data:/beszel_data
      - /configs/beszel_server_data/beszel_socket:/beszel_socket
  filebrowser:
    image: gtstef/filebrowser:${FILEBROWSER_VERSION:?set in version.env}
    container_name: filebrowser
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - FILEBROWSER_CONFIG=/home/filebrowser/data/config.yaml # overrides the default path which is ./config.yaml
      - FILEBROWSER_ADMIN_PASSWORD=${BESZEL_PASSWORD}
      - TZ=${TZ}
    volumes:
      - /data:/druv/data
      - /configs:/druv/configs
      - /home/druv:/druv/home
      - /configs/filebrowser/data:/home/filebrowser/data
    ports:
      - 8091:8091
  couchdb:
    image: couchdb:${COUCHDB_VERSION:?set in version.env}
    container_name: livesync-couchdb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - /data/couchdb:/opt/couchdb/data
      # local.d is additive. Do NOT mount over /opt/couchdb/etc/local.ini:
      # CouchDB writes runtime config there and a read-only mount breaks it.
      - ./10-livesync.ini:/opt/couchdb/etc/local.d/10-livesync.ini
    ports:
      - 5984:5984
networks:
  homelab:
    name: ${NETWORK_NAME}
    external: true
